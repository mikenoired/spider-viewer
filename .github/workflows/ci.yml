name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: spider-test-only
          POSTGRES_DB: spider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spider_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Test
        env:
          AUTH_TEST_DATABASE_URL: postgresql://postgres:spider-test-only@127.0.0.1:5432/spider_test
        run: bun run test

      - name: Prepare disposable integration schema
        env:
          DATABASE_URL: postgresql://postgres:spider-test-only@127.0.0.1:5432/spider_test
        run: bun run db:push --force

      - name: Integration tests
        env:
          APP_TEST_DATABASE_URL: postgresql://postgres:spider-test-only@127.0.0.1:5432/spider_test
        run: bun run test:integration

      - name: Build
        run: bun run build
